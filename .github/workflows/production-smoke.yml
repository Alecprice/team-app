name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production URL to verify
        required: true
        default: https://team-app.pages.dev
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Verify public production deployment
        run: node scripts/smoke-production.mjs "${{ inputs.base_url }}"
